<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Dashboard – Shell</title>
  <style>
    /* ─── Light theme ─────────────────────────────────────────────── */
    [data-theme="light"] {
      --fd-bg:           #c8ecd4;
      --fd-blob-1:       rgba(100, 200, 140, 0.45);
      --fd-blob-2:       rgba(60,  180, 110, 0.30);
      --fd-blob-3:       rgba(180, 230, 200, 0.25);
      --fd-card-bg:      rgba(255, 255, 255, 0.38);
      --fd-card-border:  rgba(255, 255, 255, 0.72);
      --fd-card-shadow:  rgba(60, 160, 100, 0.10);
      --fd-header-bg:    rgba(255, 255, 255, 0.35);
      --fd-toggle-bg:    rgba(255, 255, 255, 0.45);
      --fd-toggle-border:rgba(255, 255, 255, 0.75);
      --fd-toggle-icon:  "☀️";
    }

    /* ─── Dark theme ──────────────────────────────────────────────── */
    [data-theme="dark"] {
      --fd-bg:           #071a0c;
      --fd-blob-1:       rgba(20,  100,  50, 0.55);
      --fd-blob-2:       rgba(10,   70,  35, 0.45);
      --fd-blob-3:       rgba(40,  120,  70, 0.30);
      --fd-card-bg:      rgba(10,  50,  25, 0.55);
      --fd-card-border:  rgba(50, 160,  90, 0.22);
      --fd-card-shadow:  rgba(0,   80,  30, 0.30);
      --fd-header-bg:    rgba(10,  45,  22, 0.60);
      --fd-toggle-bg:    rgba(10,  50,  25, 0.60);
      --fd-toggle-border:rgba(60, 180, 100, 0.30);
    }

    /* ─── Reset & base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { transition: background 0.5s ease; }

    body {
      background: var(--fd-bg);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    /* Background blobs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15%  8%,  var(--fd-blob-1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 85%,  var(--fd-blob-2) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 55% 45%,  var(--fd-blob-3) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.5s ease;
    }

    /* ─── Theme toggle button ─────────────────────────────────────── */
    .fd-toggle {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 100;
      width: 56px;
      height: 30px;
      background: var(--fd-toggle-bg);
      border: 1px solid var(--fd-toggle-border);
      border-radius: 999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 2px 12px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 3px;
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      outline: none;
    }

    .fd-toggle:hover {
      box-shadow:
        0 4px 20px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.30);
    }

    /* The sliding knob */
    .fd-toggle-knob {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #e8f5ee);
      box-shadow: 0 1px 4px rgba(0,0,0,0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      transform: translateX(0);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.35s ease;
      user-select: none;
    }

    [data-theme="dark"] .fd-toggle-knob {
      transform: translateX(26px);
      background: linear-gradient(145deg, #1a4d2e, #0f3320);
    }

    /* ─── Layout container ────────────────────────────────────────── */
    .fd-container {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ─── Header shell ────────────────────────────────────────────── */
    .fd-header {
      height: 72px;
      background: var(--fd-header-bg);
      border: 1px solid var(--fd-card-border);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 4px 24px var(--fd-card-shadow);
      margin-bottom: 12px;
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* ─── Grid ────────────────────────────────────────────────────── */
    .fd-grid {
      display: grid;
      grid-template-columns: 3fr 2fr 2fr;
      gap: 12px;
    }

    /* ─── Card base ───────────────────────────────────────────────── */
    .fd-card {
      background: var(--fd-card-bg);
      border: 1px solid var(--fd-card-border);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 4px 24px var(--fd-card-shadow);
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* ─── Card grid positions & heights ──────────────────────────── */
    .fd-card--analytics    { grid-column: 1; grid-row: 1; min-height: 280px; }
    .fd-card--spending     { grid-column: 2; grid-row: 1; min-height: 280px; }
    .fd-card--transactions { grid-column: 3; grid-row: 1 / 3; min-height: 420px; }

    .fd-grid > .fd-card--metric:nth-child(4) { grid-column: 1; grid-row: 2; min-height: 130px; }
    .fd-grid > .fd-card--metric:nth-child(5) { grid-column: 2; grid-row: 2; min-height: 130px; }

    .fd-card--accounts { grid-column: 3; grid-row: 2; min-height: 200px; }
    .fd-card--savings  { grid-column: 3; grid-row: 3; min-height: 180px; }

    .fd-grid > .fd-card--metric:nth-child(8) { grid-column: 1; grid-row: 3; min-height: 130px; }
    .fd-grid > .fd-card--metric:nth-child(9) { grid-column: 2; grid-row: 3; min-height: 130px; }

    /* ─── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 1100px) {
      .fd-grid { grid-template-columns: 1fr 1fr; }
      .fd-card--analytics    { grid-column: 1 / 3; grid-row: auto; }
      .fd-card--spending     { grid-column: 1;     grid-row: auto; }
      .fd-card--transactions { grid-column: 2;     grid-row: auto; }
      .fd-card--accounts     { grid-column: 1;     grid-row: auto; }
      .fd-card--savings      { grid-column: 2;     grid-row: auto; }
      .fd-grid > .fd-card--metric { grid-column: auto !important; grid-row: auto !important; }
    }

    @media (max-width: 680px) {
      .fd-grid { grid-template-columns: 1fr; }
      .fd-card--analytics, .fd-card--transactions,
      .fd-card--savings, .fd-card--accounts { grid-column: 1; }
      .fd-toggle { top: 14px; right: 16px; }
    }
  </style>
</head>
<body>

  <!-- Theme toggle (glassmorphic iPhone-style) -->
  <button class="fd-toggle" id="themeToggle" aria-label="Toggle theme" title="Temayı değiştir">
    <span class="fd-toggle-knob" id="toggleIcon">☀️</span>
  </button>

  <div class="fd-container">
    <!-- Header shell -->
    <div class="fd-header"></div>

    <!-- Card grid -->
    <div class="fd-grid">
      <div class="fd-card fd-card--analytics"></div>
      <div class="fd-card fd-card--spending"></div>
      <div class="fd-card fd-card--transactions"></div>
      <div class="fd-card fd-card--metric"></div>
      <div class="fd-card fd-card--metric"></div>
      <div class="fd-card fd-card--accounts"></div>
      <div class="fd-card fd-card--metric"></div>
      <div class="fd-card fd-card--metric"></div>
      <div class="fd-card fd-card--savings"></div>
    </div>
  </div>

  <script>
    const html   = document.documentElement;
    const btn    = document.getElementById('themeToggle');
    const icon   = document.getElementById('toggleIcon');
    const DARK   = 'dark';
    const LIGHT  = 'light';

    // Restore saved preference
    const saved = localStorage.getItem('fd-theme') || LIGHT;
    applyTheme(saved);

    btn.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === DARK ? LIGHT : DARK;
      applyTheme(next);
      localStorage.setItem('fd-theme', next);
    });

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      icon.textContent = theme === DARK ? '🌙' : '☀️';
    }
  </script>
</body>
</html>
