<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Financial Dashboard – Shell</title> <style> :root { --fd-bg: #c8ecd4; --fd-card-bg: rgba(255, 255, 255, 0.38); --fd-card-border: rgba(255, 255, 255, 0.70); --fd-radius: 20px; --fd-radius-sm: 12px; --fd-gap: 12px; } *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } body { background: var(--fd-bg); min-height: 100vh; overflow-x: hidden; } /* subtle blobs matching the green tone */ body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 55% at 15% 8%, rgba(100, 200, 140, 0.45) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 85% 85%, rgba(60, 180, 110, 0.30) 0%, transparent 60%), radial-gradient(ellipse 50% 40% at 55% 45%, rgba(180, 230, 200, 0.25) 0%, transparent 55%); pointer-events: none; z-index: 0; } .fd-container { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 32px 24px; } /* ─── Header bar (empty shell) ───────────────────────────────── */ .fd-header { height: 72px; background: var(--fd-card-bg); border: 1px solid var(--fd-card-border); border-radius: var(--fd-radius); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); margin-bottom: var(--fd-gap); } /* ─── Grid ───────────────────────────────────────────────────── */ .fd-grid { display: grid; grid-template-columns: 3fr 2fr 2fr; gap: var(--fd-gap); } /* ─── Card base ──────────────────────────────────────────────── */ .fd-card { background: var(--fd-card-bg); border: 1px solid var(--fd-card-border); border-radius: var(--fd-radius); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 24px rgba(60, 160, 100, 0.08); } /* ─── Card sizes ─────────────────────────────────────────────── */ .fd-card--analytics { grid-column: 1; grid-row: 1; min-height: 280px; } .fd-card--spending { grid-column: 2; grid-row: 1; min-height: 280px; } .fd-card--transactions { grid-column: 3; grid-row: 1 / 3; min-height: 420px; } .fd-grid > .fd-card--metric:nth-child(4) { grid-column: 1; grid-row: 2; min-height: 130px; } .fd-grid > .fd-card--metric:nth-child(5) { grid-column: 2; grid-row: 2; min-height: 130px; } .fd-card--accounts { grid-column: 3; grid-row: 2; min-height: 200px; } .fd-card--savings { grid-column: 3; grid-row: 3; min-height: 180px; } .fd-grid > .fd-card--metric:nth-child(8) { grid-column: 1; grid-row: 3; min-height: 130px; } .fd-grid > .fd-card--metric:nth-child(9) { grid-column: 2; grid-row: 3; min-height: 130px; } /* ─── Responsive ─────────────────────────────────────────────── */ @media (max-width: 1100px) { .fd-grid { grid-template-columns: 1fr 1fr; } .fd-card--analytics { grid-column: 1 / 3; grid-row: auto; } .fd-card--spending { grid-column: 1; grid-row: auto; } .fd-card--transactions { grid-column: 2; grid-row: auto; } .fd-card--accounts { grid-column: 1; grid-row: auto; } .fd-card--savings { grid-column: 2; grid-row: auto; } .fd-grid > .fd-card--metric { grid-column: auto !important; grid-row: auto !important; } } @media (max-width: 680px) { .fd-grid { grid-template-columns: 1fr; } .fd-card--analytics, .fd-card--transactions, .fd-card--savings, .fd-card--accounts { grid-column: 1; } } </style> </head> <body> <div class="fd-container"> <div class="fd-header"></div> <div class="fd-grid"> <div class="fd-card fd-card--analytics"></div> <div class="fd-card fd-card--spending"></div> <div class="fd-card fd-card--transactions"></div> <div class="fd-card fd-card--metric"></div> <div class="fd-card fd-card--metric"></div> <div class="fd-card fd-card--accounts"></div> <div class="fd-card fd-card--metric"></div> <div class="fd-card fd-card--metric"></div> <div class="fd-card fd-card--savings"></div> </div> </div> </body> </html>
