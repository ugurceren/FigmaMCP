<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── hidden checkbox ── */
#t{display:none}

/* ── light vars (default) ── */
#fd-root{
  --bg:#c8ecd4;
  --b1:rgba(100,200,140,.45);--b2:rgba(60,180,110,.30);--b3:rgba(180,230,200,.25);
  --card:rgba(255,255,255,.38);--bdr:rgba(255,255,255,.72);--shd:rgba(60,160,100,.10);
  --hdr:rgba(255,255,255,.35);
  --tbg:rgba(255,255,255,.45);--tbdr:rgba(255,255,255,.75);
  position:relative;min-height:100vh;background:var(--bg);overflow:hidden;
  transition:background .45s
}

/* ── dark vars ── */
#t:checked~#fd-root{
  --bg:#071a0c;
  --b1:rgba(20,100,50,.55);--b2:rgba(10,70,35,.45);--b3:rgba(40,120,70,.30);
  --card:rgba(10,50,25,.55);--bdr:rgba(50,160,90,.22);--shd:rgba(0,80,30,.30);
  --hdr:rgba(10,45,22,.60);
  --tbg:rgba(10,50,25,.60);--tbdr:rgba(60,180,100,.30)
}

/* ── background blobs ── */
#fd-root::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 15%  8%, var(--b1) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 85%,var(--b2) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 55% 45%,var(--b3) 0%,transparent 55%);
  transition:background .45s
}

/* ── toggle button (label) ── */
.fd-btn{
  position:fixed;top:16px;right:20px;z-index:999;
  width:54px;height:28px;
  background:var(--tbg);border:1px solid var(--tbdr);border-radius:999px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 2px 10px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.25);
  cursor:pointer;display:flex;align-items:center;padding:2px;
  transition:background .4s,border-color .4s
}

/* knob */
.fd-knob{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(145deg,#fff,#e8f5ee);
  box-shadow:0 1px 4px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1;
  transform:translateX(0);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .35s
}
.fd-knob::before{content:'☀️'}

/* dark state */
#t:checked~.fd-btn .fd-knob{
  transform:translateX(24px);
  background:linear-gradient(145deg,#1a4d2e,#0f3320)
}
#t:checked~.fd-btn .fd-knob::before{content:'🌙'}

/* ── layout ── */
.fd-wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:28px 20px}

.fd-header{
  height:68px;background:var(--hdr);border:1px solid var(--bdr);border-radius:18px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 4px 20px var(--shd);margin-bottom:10px;transition:background .4s,border-color .4s
}

.fd-grid{display:grid;grid-template-columns:3fr 2fr 2fr;gap:10px}

.fd-card{
  background:var(--card);border:1px solid var(--bdr);border-radius:18px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 4px 20px var(--shd);transition:background .4s,border-color .4s
}

.ca{grid-column:1;grid-row:1;min-height:270px}
.cs{grid-column:2;grid-row:1;min-height:270px}
.ct{grid-column:3;grid-row:1/3;min-height:400px}
.m1{grid-column:1;grid-row:2;min-height:125px}
.m2{grid-column:2;grid-row:2;min-height:125px}
.co{grid-column:3;grid-row:2;min-height:190px}
.m3{grid-column:1;grid-row:3;min-height:125px}
.m4{grid-column:2;grid-row:3;min-height:125px}
.ck{grid-column:3;grid-row:3;min-height:175px}

@media(max-width:1000px){
  .fd-grid{grid-template-columns:1fr 1fr}
  .ca{grid-column:1/3}.cs,.ct,.co,.ck,.m1,.m2,.m3,.m4{grid-column:auto;grid-row:auto}
}
</style>

<input type="checkbox" id="t">
<label for="t" class="fd-btn"><span class="fd-knob"></span></label>

<div id="fd-root">
  <div class="fd-wrap">
    <div class="fd-header"></div>
    <div class="fd-grid">
      <div class="fd-card ca"></div>
      <div class="fd-card cs"></div>
      <div class="fd-card ct"></div>
      <div class="fd-card m1"></div>
      <div class="fd-card m2"></div>
      <div class="fd-card co"></div>
      <div class="fd-card m3"></div>
      <div class="fd-card m4"></div>
      <div class="fd-card ck"></div>
    </div>
  </div>
</div>
